<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    .step-item {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .step-active {
      color: #004322; /* primary */
      font-weight: 600;
    }

    .step-completed {
      color: #707971; /* outline */
      opacity: 0.7;
    }

    .gradient-progress {
      background: linear-gradient(90deg, #1A5C36 0%, #4ade80 100%);
      transition: width 0.1s linear;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 1.5s linear infinite;
    }

    .shimmer {
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.2) 50%, transparent 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      from { background-position: -200% 0; }
      to { background-position: 200% 0; }
    }
  </style>

<body class="bg-[#E2EFEB] min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Background Texture -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none opacity-20">
<div class="absolute inset-0" style="background-image: radial-gradient(#1A5C36 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>

<!-- Main Centered Card -->
<main class="relative z-10 w-[460px] bg-surface-container-lowest rounded-[20px] p-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-outline-variant mx-sm">

<header class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-md text-primary tracking-tight">ProductIQ</h1>
<p class="text-on-surface-variant font-caption text-caption uppercase tracking-widest mt-base">Market Intelligence Engine</p>
</header>
<!-- Progress Visualization -->
<div class="mb-xl">
<div class="flex justify-between items-end mb-sm">
<span class="font-data-label text-data-label text-on-surface-variant uppercase">Analyzing Data Pipeline</span>
<span class="font-data-value text-body-lg text-primary tabular-nums" id="progress-percentage">0%</span>
</div>
<div class="w-full h-[6px] bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full gradient-progress w-0" id="progress-bar"></div>
</div>
</div>
<!-- Step Checklist -->
<nav aria-label="Processing Steps" class="space-y-md">
<!-- Step 1 -->
<div class="step-item flex items-center gap-md opacity-40" id="step-0">
<div class="status-icon w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-outline" data-icon="sync">sync</span>
</div>
<span class="font-body-md text-body-md">Researching Product</span>
</div>
<!-- Step 2 -->
<div class="step-item flex items-center gap-md opacity-40" id="step-1">
<div class="status-icon w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-outline" data-icon="sync">sync</span>
</div>
<span class="font-body-md text-body-md">Scraping Indian Marketplaces</span>
</div>
<!-- Step 3 -->
<div class="step-item flex items-center gap-md opacity-40" id="step-2">
<div class="status-icon w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-outline" data-icon="sync">sync</span>
</div>
<span class="font-body-md text-body-md">Calculating Customs &amp; Duties</span>
</div>
<!-- Step 4 -->
<div class="step-item flex items-center gap-md opacity-40" id="step-3">
<div class="status-icon w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-outline" data-icon="sync">sync</span>
</div>
<span class="font-body-md text-body-md">Analyzing Competition</span>
</div>
<!-- Step 5 -->
<div class="step-item flex items-center gap-md opacity-40" id="step-4">
<div class="status-icon w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-outline" data-icon="sync">sync</span>
</div>
<span class="font-body-md text-body-md">AI Verdict Generation</span>
</div>

<span class="material-symbols-outlined text-[14px]" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
        Secure Institutional Grade Connection
      </div>

</main>
<script>
    const steps = [
      "Researching Product",
      "Scraping Indian Marketplaces",
      "Calculating Customs & Duties",
      "Analyzing Competition",
      "AI Verdict Generation"
    ];

    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-percentage');
    const totalDuration = 3700; // 3.7 seconds total
    const startTime = Date.now();

    function updateUI() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / totalDuration, 1);
      const percentage = Math.floor(progress * 100);

      // Update progress bar and text
      progressBar.style.width = `${percentage}%`;
      progressText.textContent = `${percentage}%`;

      // Update steps based on progress
      const stepInterval = 1 / steps.length;
      steps.forEach((_, index) => {
        const stepElement = document.getElementById(`step-${index}`);
        const iconContainer = stepElement.querySelector('.status-icon');
        const iconSpan = iconContainer.querySelector('span');
        
        const stepProgressStart = index * stepInterval;
        const stepProgressEnd = (index + 1) * stepInterval;

        if (progress >= stepProgressEnd) {
          // Completed state
          stepElement.classList.remove('opacity-40', 'step-active');
          stepElement.classList.add('step-completed', 'opacity-70');
          iconSpan.textContent = 'check_circle';
          iconSpan.classList.remove('animate-spin-slow', 'text-outline');
          iconSpan.classList.add('text-primary');
          iconSpan.style.fontVariationSettings = "'FILL' 1";
        } else if (progress >= stepProgressStart) {
          // Active state
          stepElement.classList.remove('opacity-40');
          stepElement.classList.add('step-active');
          iconSpan.textContent = 'sync';
          iconSpan.classList.add('animate-spin-slow', 'text-primary');
          iconSpan.style.fontVariationSettings = "'FILL' 0";
        } else {
          // Future state
          stepElement.classList.add('opacity-40');
        }
      });

      if (progress < 1) {
        requestAnimationFrame(updateUI);
      } else {
        // Final completion state
        progressText.textContent = '100%';
        progressBar.style.width = '100%';
        // Simulate navigation after short delay
        setTimeout(() => {
          console.log("Analysis Complete. Transitioning...");
        }, 500);
      }
    }

    // Start animation
    requestAnimationFrame(updateUI);
  </script>
